<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LangGraph Chat</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #12171d;
    --panel: #1a2129;
    --ink: #e3e9ee;
    --muted: #8a98a6;
    --line: #2b3641;
    --me: #1f5570;
    --me-ink: #f2f7fa;
    --bot: #242e38;
    --accent: #2aa6b8;
    --error: #f2938b;
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 760px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  header h1 { font-size: 1.05rem; margin: 0; font-weight: 650; letter-spacing: .01em; }
  header button {
    background: none; border: 1px solid var(--line); color: var(--muted);
    padding: 5px 12px; border-radius: 6px; cursor: pointer; font: inherit; font-size: .85rem;
  }
  header button:hover { color: var(--ink); border-color: var(--muted); }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 32ch; line-height: 1.5; }
  .msg {
    max-width: 84%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.55;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg.user { align-self: flex-end; background: var(--me); color: var(--me-ink); border-bottom-right-radius: 3px; }
  .msg.ai   { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 3px; }
  .msg.err  { align-self: flex-start; background: #3a2020; color: var(--error); border: 1px solid #5c3030; }
  .msg code, .msg pre { font-family: Consolas, "Courier New", monospace; font-size: .9em; }
  .msg pre {
    background: #0e1318; color: #e8eef3; padding: 10px 12px; border-radius: 8px;
    overflow-x: auto; margin: 8px 0; white-space: pre;
  }
  .msg :not(pre) > code { background: #323f4b; padding: 1px 5px; border-radius: 4px; }
  .msg.user :not(pre) > code { background: rgba(255,255,255,.18); }

  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.1s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  form {
    display: flex; gap: 10px; align-items: flex-end;
    padding: 14px 20px; border-top: 1px solid var(--line);
  }
  textarea {
    flex: 1; resize: none; max-height: 160px; min-height: 44px;
    padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px;
    font: inherit; line-height: 1.4; color: var(--ink); background: var(--bg);
  }
  textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #send {
    background: var(--accent); color: #07161a; border: 0; border-radius: 10px;
    padding: 0 20px; height: 44px; font: inherit; font-weight: 600; cursor: pointer;
  }
  #send:disabled { opacity: .5; cursor: not-allowed; }

  @media (max-width: 560px) {
    .app { border: 0; }
    .msg { max-width: 92%; }
  }
  @media (prefers-reduced-motion: reduce) { .typing i { animation: none; opacity: .6; } }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>LangGraph Chat</h1>
    <button type="button" id="clear">Clear chat</button>
  </header>

  <section id="log" aria-live="polite">
    <p class="empty" id="empty">Ask a question to start the conversation.</p>
  </section>

  <form id="form">
    <textarea id="input" rows="1" placeholder="Type your question" aria-label="Your question" required></textarea>
    <button type="submit" id="send">Send</button>
  </form>
</main>

<script>
  // Same-origin by default. If this file is opened separately from the API,
  // set the full URL, e.g. "http://127.0.0.1:8000/chat" (and enable CORS on the server).
  const API_URL = "/chat";

  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const emptyNote = document.getElementById("empty");

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // Minimal formatting: ```code blocks``` and `inline code`
  function render(text) {
    const parts = text.split(/```(?:\w+)?\n?([\s\S]*?)```/g);
    return parts.map((p, i) =>
      i % 2 === 1
        ? "<pre><code>" + escapeHtml(p.replace(/\n$/, "")) + "</code></pre>"
        : escapeHtml(p).replace(/`([^`\n]+)`/g, "<code>$1</code>")
    ).join("");
  }

  function addMessage(kind, text) {
    if (emptyNote) emptyNote.remove();
    const el = document.createElement("div");
    el.className = "msg " + kind;
    if (kind === "ai") el.innerHTML = render(text);
    else el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function addTyping() {
    const el = addMessage("ai", "");
    el.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
    return el;
  }

  // The API returns {messages: [...]}; the reply is the last message.
  function extractReply(data) {
    const msgs = (data && data.messages) || [];
    const last = msgs[msgs.length - 1];
    if (!last) return "";
    const c = last.content;
    if (typeof c === "string") return c;
    if (Array.isArray(c)) {
      return c.map(b => (typeof b === "string" ? b : b.text || "")).join("");
    }
    return JSON.stringify(c);
  }

  async function ask(question) {
    sendBtn.disabled = true;
    addMessage("user", question);
    const pending = addTyping();
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ questions: question })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || ("Request failed (" + res.status + ")"));
      pending.className = "msg ai";
      pending.innerHTML = render(extractReply(data) || "(empty response)");
    } catch (err) {
      pending.className = "msg err";
      pending.textContent = "Could not get a reply: " + err.message;
    } finally {
      sendBtn.disabled = false;
      input.focus();
      log.scrollTop = log.scrollHeight;
    }
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q || sendBtn.disabled) return;
    input.value = "";
    input.style.height = "auto";
    ask(q);
  });

  // Enter sends, Shift+Enter adds a new line
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  });

  document.getElementById("clear").addEventListener("click", () => {
    log.innerHTML = '<p class="empty" id="empty">Ask a question to start the conversation.</p>';
  });
</script>
</body>
</html>
